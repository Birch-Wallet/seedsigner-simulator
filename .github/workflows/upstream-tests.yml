# Runs upstream SeedSigner's own test suite against the dependency versions this
# repository pins for it.
#
# This repository ships a great deal of upstream code verbatim and very little of
# its own. Writing our own tests for the firmware's behaviour is reinventing a wheel
# upstream already turns: SeedSigner ships a pytest suite written by the people
# who wrote the code it tests. Running it costs one job and nothing else.
#
# The reason it is worth running *here* rather than just trusting that upstream
# runs it is build/build-firmware-zip.sh. That script chooses its own dependency
# versions, each by exact version and sha256, because a firmware zip has to be
# assembled by hand from content-addressed artifacts to be reproducible.
# Upstream tests against whatever their requirements.txt resolves to. Those two
# sets agree today, and nothing enforces that they keep agreeing. This job is
# what says so: it installs OUR pins and runs THEIR tests, so the day a repin
# moves us off what upstream's code expects, a test written by upstream goes red
# and names the behaviour that changed.
#
# Nothing is vendored. The suite is cloned at CI time from the same commit
# UPSTREAM pins the firmware to, read out of that file at runtime rather than copied
# into this workflow: a sha written down here would silently rot the day we
# repin, which is exactly the day this job needs to be right.
#
# Its own workflow, like reproducible-build.yml, so it goes red under its own
# name and against its own question. It must not share test.yml's cache: a job
# whose whole point is "install these exact versions" should install them rather
# than find them lying around.
name: upstream-tests

on:
  # Pushes only on the default branch, and every pull request. A
  # contributor's branch is tested when they open the PR, rather than
  # twice for every push once they have.
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.firmware }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Each firmware's suite, against that firmware's own pins: stock, the
        # release, and dev, the development-branch pin.
        firmware: [stock, dev]
    # The stock suite runs in seconds on CPython; this is headroom, not cost.
    timeout-minutes: 20

    env:
      FIRMWARE: ${{ matrix.firmware }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No `cache:` key deliberately. setup-python's pip cache is keyed on a
          # requirements file in the repository, and this job's requirements are
          # derived at runtime from the build script's table; there is nothing
          # stable to key on, and a stale wheel is precisely the failure mode
          # this job exists to catch.

      # pyzbar is a ctypes wrapper: it looks the shared library up by name at
      # import time, so libzbar has to be in the linker cache or the import
      # raises. decode_qr.py imports pyzbar at module scope with no try/except,
      # so without this seven test files fail during collection.
      #
      # libzbar0 is a virtual package on noble and apt resolves it to its one
      # provider, libzbar0t64. --no-install-recommends is what keeps the
      # optional ImageMagick and ghostscript chain, about 40 packages, out of a
      # job that needs three shared libraries.
      - name: Install libzbar
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libzbar0

      - name: Clone upstream at the pin
        run: |
          set -euo pipefail

          # Same section-aware awk idiom build-firmware-zip.sh reads the pin with,
          # against the same file. One place to look, one place to change.
          field() {
            awk -F= -v want="[${FIRMWARE}]" -v key="$1" '
                /^\[/   { inside = ($0 == want); next }
                inside && $1 ~ "^[[:space:]]*" key "[[:space:]]*$" {
                    gsub(/[[:space:]]/, "", $2); print $2
                }
            ' UPSTREAM
          }

          repo="$(field repo)"
          commit="$(field commit)"
          tag="$(field tag)$(field branch)"
          [ -n "${repo}" ]   || { echo "no 'repo =' line in UPSTREAM [${FIRMWARE}]" >&2; exit 1; }
          [ -n "${commit}" ] || { echo "no 'commit =' line in UPSTREAM [${FIRMWARE}]" >&2; exit 1; }

          echo "upstream  ${repo}"
          echo "commit    ${commit}"
          echo "tag/branch ${tag}"

          dir="${RUNNER_TEMP}/upstream"
          git init --quiet "${dir}"
          git -C "${dir}" remote add origin "${repo}"
          git -C "${dir}" fetch --quiet --depth 1 origin "${commit}"
          git -C "${dir}" -c advice.detachedHead=false checkout --quiet FETCH_HEAD

          # git verifies the object graph hashes to what we asked for, so landing
          # on the right sha is the whole integrity check.
          head="$(git -C "${dir}" rev-parse HEAD)"
          [ "${head}" = "${commit}" ] || { echo "checkout landed on ${head}, expected ${commit}" >&2; exit 1; }

          echo "UPSTREAM_DIR=${dir}" >> "$GITHUB_ENV"

      - name: Work out this repository's pinned dependency set
        run: |
          set -euo pipefail

          # The authoritative list is this firmware's dependency table inside
          # build-firmware-zip.sh (DEPENDENCIES_STOCK or DEPENDENCIES_DEV): the
          # same rows that decide what goes into the firmware zip, version and
          # sha256 and all. Read out of the script rather than duplicated here,
          # for the same reason the upstream sha is: a copy is a thing that can
          # drift.
          table="DEPENDENCIES_$(echo "${FIRMWARE}" | tr '[:lower:]' '[:upper:]')"
          awk -v table="${table}" '
              inside && /^DEPS$/   { exit }
              inside               { print }
              $0 ~ ("^read -r -d .. " table " <<") { inside = 1 }
          ' build/build-firmware-zip.sh > "${RUNNER_TEMP}/pins.txt"
          [ -s "${RUNNER_TEMP}/pins.txt" ] || { echo "could not read the dependency table out of build/build-firmware-zip.sh" >&2; exit 1; }

          # The pypi rows become a hash-pinned requirements file pointing at the
          # exact artifacts the build fetches, same URL and same sha256, so what
          # the tests import is byte for byte what the firmware zip is built from.
          awk -F'|' '$1=="pypi" { printf "%s @ %s --hash=sha256:%s\n", $3, $5, $6 }' \
              "${RUNNER_TEMP}/pins.txt" > "${RUNNER_TEMP}/req-ours.txt"

          # The git rows -- dev pins urtypes by commit -- cannot go in a
          # hash-checked file, since pip cannot hash a checkout. They are
          # installed apart, by commit, which git itself verifies.
          awk -F'|' '$1=="git" { printf "%s @ git+%s@%s\n", $3, $5, $6 }' \
              "${RUNNER_TEMP}/pins.txt" > "${RUNNER_TEMP}/req-ours-git.txt"

          # The two requirements.txt lines a zip cannot carry, taken from
          # upstream's own file at upstream's own versions: Pillow is a compiled
          # extension Pyodide supplies, and pyzbar binds libzbar, which has no
          # WebAssembly build (src/fakes/pyzbar stands in for it in the browser,
          # and must not stand in for it here). Read whole entries, not lines:
          # dev's requirements.txt is hash-locked, each entry continued over
          # several lines of --hash, and pyzbar is a `name @ url` entry rather
          # than `name==`. The hashes are dropped, since this file is installed
          # on its own. The count is asserted so that an upstream that drops or
          # renames one fails here, loudly, rather than quietly testing without it.
          python3 - "${UPSTREAM_DIR}/requirements.txt" > "${RUNNER_TEMP}/req-compiled.txt" <<'PY'
          import re, sys
          text = re.sub(r"\\\n", " ", open(sys.argv[1]).read())
          for line in text.splitlines():
              spec = line.split("#", 1)[0].split("--hash", 1)[0].strip()
              if re.match(r"^(Pillow|pyzbar)\s*(==|@)", spec, re.I):
                  print(spec)
          PY
          count="$(wc -l < "${RUNNER_TEMP}/req-compiled.txt")"
          [ "${count}" -eq 2 ] || { echo "expected 2 compiled dependencies in upstream's requirements.txt, found ${count}" >&2; exit 1; }

          echo "=== our pins, from build/build-firmware-zip.sh ==="
          cat "${RUNNER_TEMP}/req-ours.txt"
          echo
          echo "=== compiled dependencies, from upstream's requirements.txt ==="
          cat "${RUNNER_TEMP}/req-compiled.txt"

      - name: Install
        run: |
          set -euo pipefail

          # Order matters: ours go on last, with --no-deps, so that if a pin ever
          # disagrees with what upstream's resolver would have picked, ours is
          # what the tests run against. That is the entire point of the job.
          python -m pip install --disable-pip-version-check -r "${RUNNER_TEMP}/req-compiled.txt"
          python -m pip install --disable-pip-version-check -r "${UPSTREAM_DIR}/tests/requirements.txt"
          python -m pip install --disable-pip-version-check \
              --no-deps --force-reinstall --require-hashes -r "${RUNNER_TEMP}/req-ours.txt"
          if [ -s "${RUNNER_TEMP}/req-ours-git.txt" ]; then
            python -m pip install --disable-pip-version-check \
                --no-deps --force-reinstall -r "${RUNNER_TEMP}/req-ours-git.txt"
          fi

          # Upstream has no conftest.py at the root of tests/, so nothing puts
          # the firmware on sys.path. Without this, 21 files fail to import.
          echo "PYTHONPATH=${UPSTREAM_DIR}/src" >> "$GITHUB_ENV"

      # Five of the tests assert that a string comes back translated. The
      # catalogues are a git submodule that ships .po sources and no compiled .mo,
      # and gettext reads only .mo, so without both halves of this step those five
      # fail on `assert 'Home' != 'Home'`: the untranslated string coming back.
      #
      # The submodule is named rather than fetched with --recursive, because the
      # other one, seedsigner-screenshots, is marked `update = none` in
      # .gitmodules and holds nothing any test reads.
      #
      # Babel comes from upstream's own l10n requirements file, at upstream's own
      # versions, like everything else here that is not one of our pins.
      - name: Fetch and compile the translation catalogues
        run: |
          set -euo pipefail
          git -C "${UPSTREAM_DIR}" submodule update --init --depth 1 \
              src/seedsigner/resources/seedsigner-translations
          python -m pip install --disable-pip-version-check \
              -r "${UPSTREAM_DIR}/l10n/requirements-l10n.txt"
          cd "${UPSTREAM_DIR}"
          python setup.py compile_catalog

      - name: Show what is actually installed
        run: |
          set -euo pipefail
          # So a reader of a green run can see which versions it was green
          # against, without having to reconstruct them from the pins.
          #
          # One oddity worth expecting: urtypes lists itself as 0.0.0 on stock,
          # because its 1.0.1 sdist carries no usable version metadata, and as
          # 0.1.0 on dev, which is what the pinned commit's own metadata says.
          # The code is what was pinned either way; only the label pip prints is
          # misleading.
          python -m pip list --format=columns
          echo
          python -m pip check || true

      - name: Run upstream's suite
        run: |
          set -euo pipefail

          # tests/screenshot_generator/ is not collected, and by nobody's
          # decision: its only test module is named generator.py, which does not
          # match pytest's default python_files, which is why upstream runs it as
          # a separate CI step.
          #
          # cwd is the clone root, because tests do their own relative sys.path
          # work that assumes it. -rs lists every skip and its reason.
          cd "${UPSTREAM_DIR}"
          python -m pytest tests/ -rs -q
